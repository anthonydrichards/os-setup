# =============================================================================
# kitty.conf – Terminal emulator config
# Solarized Night palette | JetBrainsMono Nerd Font
# =============================================================================

# --- Font ---
font_family      JetBrainsMonoNL Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Cursor ---
cursor_shape            block
cursor_blink_interval   0
cursor_stop_blinking_after 0

# --- Scrollback ---
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# --- Mouse ---
copy_on_select   no
focus_follows_mouse yes

# --- Window ---
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width  1200
initial_window_height  720

# --- Tabs ---
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_edge            bottom
tab_title_template      "{index}: {title}"
active_tab_font_style   bold
inactive_tab_font_style normal

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0

# =============================================================================
# SOLARIZED NIGHT COLORS
# =============================================================================
foreground              #839496
background              #002b36
selection_foreground    #002b36
selection_background    #839496

# Cursor
cursor                  #839496
cursor_text_color       #002b36

# URL underline
url_color               #268bd2

# Normal (0-7)
color0  #073642
color1  #dc322f
color2  #859900
color3  #b58900
color4  #268bd2
color5  #d33682
color6  #2aa198
color7  #eee8d5

# Bright (8-15)
color8  #002b36
color9  #cb4b16
color10 #586e75
color11 #657b83
color12 #839496
color13 #6c71c4
color14 #93a1a1
color15 #fdf6e3

# Tab bar colors
active_tab_foreground   #002b36
active_tab_background   #268bd2
inactive_tab_foreground #657b83
inactive_tab_background #073642
tab_bar_background      #002b36

# =============================================================================
# KEY MAPPINGS
# =============================================================================
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+0     restore_font_size
