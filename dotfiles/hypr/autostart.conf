# =============================================================================
# autostart.conf – Programs launched at Hyprland startup
# =============================================================================

# Wallpaper daemon
exec-once = hyprpaper

# Status bar
exec-once = waybar

# Notification daemon
exec-once = mako

# Clipboard manager (records clipboard history)
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Idle / autolock
exec-once = hypridle

# Polkit agent (for privilege dialogs)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Gnome keyring (for SSH/GPG/secrets)
exec-once = gnome-keyring-daemon --start --components=secrets,ssh,pkcs11

# Network manager tray applet
exec-once = nm-applet --indicator

# Bluetooth tray
exec-once = blueman-applet

# Removable media automounter
exec-once = udiskie --tray

# XDG autostart (e.g. for apps that register with XDG)
exec-once = dex --autostart --environment Hyprland
