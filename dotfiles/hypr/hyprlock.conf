# =============================================================================
# hyprlock.conf – Lock screen
# Solarized Night palette
# =============================================================================

background {
    monitor     =
    path        = ~/.local/share/backgrounds/space.jpg
    blur_size   = 7
    blur_passes = 3
    brightness  = 0.6
    contrast    = 0.9
    noise       = 0.02
}

# Clock
label {
    monitor =
    text    = cmd[update:1000] echo "$(date '+%H:%M')"
    color   = rgba(fdf6e3ff)
    font_size  = 80
    font_family = JetBrainsMonoNL Nerd Font
    position    = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text    = cmd[update:60000] echo "$(date '+%A, %d %B %Y')"
    color   = rgba(93a1a1ff)
    font_size  = 22
    font_family = JetBrainsMonoNL Nerd Font
    position    = 0, 120
    halign = center
    valign = center
}

# Password input box
input-field {
    monitor   =
    size      = 320, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing   = 0.15
    dots_center    = true
    outer_color    = rgba(073642ff)
    inner_color    = rgba(002b36ee)
    font_color     = rgba(fdf6e3ff)
    fade_on_empty  = false
    placeholder_text = <span foreground="##657b83">Enter password…</span>
    hide_input     = false
    check_color    = rgba(2aa198ff)
    fail_color     = rgba(dc322fff)
    fail_text      = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(b58900ff)
    position    = 0, -50
    halign = center
    valign = center
}
