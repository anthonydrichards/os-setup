# =============================================================================
# windowrules.conf – Per-app rules
# =============================================================================

# Float small utility dialogs
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(lxappearance)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1)$

# Chromium web apps – tile normally
windowrulev2 = tile, class:^(chromium)$, title:^(Amazon Music)$
windowrulev2 = tile, class:^(chromium)$, title:^(GitHub)$

# Assign apps to workspaces
windowrulev2 = workspace 1, class:^(kitty)$
windowrulev2 = workspace 2, class:^(chromium)$
windowrulev2 = workspace 3, class:^(code)$
windowrulev2 = workspace 4, class:^(steam)$

# Fix Steam black window
windowrulev2 = stayfocused, class:^(steam)$, title:^()$
windowrulev2 = minsize 1 1, class:^(steam)$, title:^()$

# Fix XWayland scaling artifacts
windowrulev2 = rounding 0, xwayland:1

# Idle inhibit for fullscreen apps and games
windowrulev2 = idleinhibit fullscreen, class:.*
windowrulev2 = idleinhibit focus, class:^(steam_app_.*)$
