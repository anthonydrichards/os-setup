# =============================================================================
# Hyprland main config
# Hardware: Ryzen 9 5950X | RTX 3090 | 2560x1440@165Hz
# =============================================================================

# Source modular configs
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/appearance.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/autostart.conf

# ---------------------------------------------------------------------------
# GENERAL
# ---------------------------------------------------------------------------
general {
    gaps_in           = 4
    gaps_out          = 8
    border_size       = 2
    col.active_border = rgba(268bd2ff) rgba(2aa198ff) 45deg
    col.inactive_border = rgba(073642aa)
    layout            = dwindle
    resize_on_border  = true
    allow_tearing     = false
}

# ---------------------------------------------------------------------------
# DECORATION
# ---------------------------------------------------------------------------
decoration {
    rounding       = 8
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled   = true
        size      = 6
        passes    = 2
        noise     = 0.02
        contrast  = 0.9
        brightness = 0.8
    }

    shadow {
        enabled = true
        range   = 12
        render_power = 3
        color   = rgba(00000088)
    }
}

# ---------------------------------------------------------------------------
# ANIMATIONS
# ---------------------------------------------------------------------------
animations {
    enabled = true

    bezier = easeOut,  0.16, 1, 0.3, 1
    bezier = easeIn,   0.7,  0, 0.84, 0
    bezier = slide,    0.25, 1, 0.5,  1

    animation = windows,     1, 4, easeOut, slide
    animation = windowsOut,  1, 3, easeIn,  slide
    animation = border,      1, 6, default
    animation = fade,        1, 4, easeOut
    animation = workspaces,  1, 4, slide
}

# ---------------------------------------------------------------------------
# LAYOUTS
# ---------------------------------------------------------------------------
dwindle {
    pseudotile          = true
    preserve_split      = true
    smart_split         = true
    smart_resizing      = true
}

master {
    new_status = master
}

# ---------------------------------------------------------------------------
# MISCELLANEOUS
# ---------------------------------------------------------------------------
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    vfr                     = true
    mouse_move_enables_dpms  = true
    key_press_enables_dpms   = true
}

# ---------------------------------------------------------------------------
# CURSOR
# ---------------------------------------------------------------------------
cursor {
    no_hardware_cursors = 0
}

# ---------------------------------------------------------------------------
# ENVIRONMENT VARIABLES
# ---------------------------------------------------------------------------
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
# NVIDIA
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,0
env = GBM_BACKEND,nvidia-drm
