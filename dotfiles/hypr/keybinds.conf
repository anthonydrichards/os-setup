# =============================================================================
# keybinds.conf – All Hyprland keybindings
# Modifier: SUPER (Win key)
# See KEYBINDS.md for the human-friendly table.
# =============================================================================

$mod = SUPER

# ---------------------------------------------------------------------------
# APPLICATION LAUNCHERS (Run-or-raise via script)
# ---------------------------------------------------------------------------
bind = $mod,       T, exec, ~/.local/bin/ror kitty        "kitty"
bind = $mod,       B, exec, ~/.local/bin/ror chromium     "chromium"
bind = $mod,       C, exec, ~/.local/bin/ror code         "code"
bind = $mod SHIFT, F, exec, thunar

# ---------------------------------------------------------------------------
# WEB APPS (Chromium app mode, run-or-raise)
# ---------------------------------------------------------------------------
bind = $mod, F1, exec, ~/.local/bin/webapp "Amazon Music"  "https://music.amazon.co.uk" "--app=https://music.amazon.co.uk"
bind = $mod, F2, exec, ~/.local/bin/webapp "GitHub"        "https://github.com"          "--app=https://github.com"

# ---------------------------------------------------------------------------
# LAUNCHER / SYSTEM
# ---------------------------------------------------------------------------
bind = $mod, SPACE,  exec, fuzzel
bind = $mod, V,      exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, C, exec, hyprpicker -a   # colour picker → clipboard
bind = $mod, ESCAPE, exec, hyprlock
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, E, exec, ~/.local/bin/powermenu

# ---------------------------------------------------------------------------
# SCREENSHOT (hyprshot)
# ---------------------------------------------------------------------------
bind = ,       Print, exec, hyprshot -m output  -o ~/Pictures/Screenshots
bind = SHIFT,  Print, exec, hyprshot -m region  -o ~/Pictures/Screenshots
bind = $mod,   Print, exec, hyprshot -m window  -o ~/Pictures/Screenshots

# ---------------------------------------------------------------------------
# AUDIO
# ---------------------------------------------------------------------------
bindel = ,XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@   5%+
bindel = ,XF86AudioLowerVolume,  exec, wpctl set-volume         @DEFAULT_AUDIO_SINK@   5%-
bindl  = ,XF86AudioMute,         exec, wpctl set-mute           @DEFAULT_AUDIO_SINK@   toggle
bindl  = ,XF86AudioMicMute,      exec, wpctl set-mute           @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = ,XF86AudioPlay,         exec, playerctl play-pause
bindl  = ,XF86AudioNext,         exec, playerctl next
bindl  = ,XF86AudioPrev,         exec, playerctl previous

# ---------------------------------------------------------------------------
# WINDOW FOCUS (arrow keys)
# ---------------------------------------------------------------------------
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
# Vim-style aliases
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# ---------------------------------------------------------------------------
# WINDOW MOVEMENT
# ---------------------------------------------------------------------------
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# ---------------------------------------------------------------------------
# WINDOW RESIZE (mouse or keyboard)
# ---------------------------------------------------------------------------
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind  = $mod ALT, left,  resizeactive, -40 0
bind  = $mod ALT, right, resizeactive,  40 0
bind  = $mod ALT, up,    resizeactive,  0 -40
bind  = $mod ALT, down,  resizeactive,  0  40

# ---------------------------------------------------------------------------
# LAYOUT TOGGLES
# ---------------------------------------------------------------------------
bind = $mod, F,       fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1   # maximise (no gaps)
bind = $mod, P,       pseudo           # dwindle pseudo-tile
bind = $mod, S,       togglesplit       # dwindle split direction

# Float toggle
bind = $mod SHIFT, space, togglefloating

# ---------------------------------------------------------------------------
# WORKSPACES (1-9)
# ---------------------------------------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move window to workspace (silent = don't follow)
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9

# Scroll through workspaces with mouse wheel over bar
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ---------------------------------------------------------------------------
# SPECIAL WORKSPACE (scratchpad)
# ---------------------------------------------------------------------------
bind = $mod,       grave, togglespecialworkspace, scratchpad
bind = $mod SHIFT, grave, movetoworkspace,        special:scratchpad
