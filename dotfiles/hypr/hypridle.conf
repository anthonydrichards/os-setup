# =============================================================================
# hypridle.conf – Idle timeouts and autolock
# =============================================================================

general {
    lock_cmd      = pidof hyprlock || hyprlock   # run hyprlock if not running
    before_sleep_cmd = loginctl lock-session       # lock before suspend
    after_sleep_cmd  = hyprctl dispatch dpms on    # wake screen after resume
    ignore_dbus_inhibit = false
}

# Dim screen after 3 min
listener {
    timeout  = 180
    on-timeout  = brightnessctl -s set 20%
    on-resume   = brightnessctl -r
}

# Lock screen after 5 min
listener {
    timeout  = 300
    on-timeout  = loginctl lock-session
}

# Turn off display after 8 min
listener {
    timeout  = 480
    on-timeout  = hyprctl dispatch dpms off
    on-resume   = hyprctl dispatch dpms on
}

# Suspend after 30 min (remove if undesired)
listener {
    timeout  = 1800
    on-timeout  = systemctl suspend
}
